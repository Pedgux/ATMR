# This workflow will build a .NET project

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Restore dependencies
        run: dotnet restore src/ATMR.csproj

      - name: Build
        run: dotnet build src/ATMR.csproj --no-restore --configuration Release
